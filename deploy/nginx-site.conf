upstream rosetta_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream rosetta_frontend {
    # Astro preview (开发/自托管) 或其他静态服务器
    server 127.0.0.1:4321 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    # 真实部署时改成：server_name example.com www.example.com;

    # 日志
    access_log /var/log/nginx/rosetta.access.log;
    error_log  /var/log/nginx/rosetta.error.log;

    # 大文件上传（媒体/头像等）
    client_max_body_size 50m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ACME 挑战（Let's Encrypt 证书时使用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # ============================================================
    # /api, /media -> backend
    # ============================================================
    location /api/ {
        proxy_pass http://rosetta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /media/ {
        proxy_pass http://rosetta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # 其余 -> frontend (Astro 静态)
    # ============================================================
    location / {
        proxy_pass http://rosetta_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

