<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="Rosetta banner">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0B1020"/>
      <stop offset="50%"  stop-color="#0F1730"/>
      <stop offset="100%" stop-color="#131B38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1DA1FF"/>
      <stop offset="33%"  stop-color="#7C3AED"/>
      <stop offset="66%"  stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#FF5D01"/>
    </linearGradient>
    <linearGradient id="rosettaLogoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1DA1FF"/>
      <stop offset="50%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="280" rx="20" fill="url(#bannerBg)"/>
  <rect width="1280" height="280" rx="20" fill="url(#grid)"/>

  <!-- accent glow -->
  <circle cx="1100" cy="70"  r="170" fill="#7C3AED" opacity="0.12"/>
  <circle cx="1050" cy="230" r="150" fill="#1DA1FF" opacity="0.10"/>
  <circle cx="180"  cy="210" r="130" fill="#C026D3" opacity="0.08"/>

  <!-- Rosetta R logo (200x200) -->
  <g transform="translate(72 40)">
    <path d="M112 10
             C 85.8 7.9 60 12.5 35.2 29.8
             L 14.8 42.5
             C 6.3 47.5 0 56.4 0 66.4
             L 0 190 C 0 199 5.5 207.3 14 212.2
             L 62.4 240 C 86.3 253.6 112 260 138.2 260
             C 164.5 260 190.2 253.5 214 240
             L 262.4 212.2
             C 270.9 207.3 276.4 199 276.4 190
             L 276.4 66.4
             C 276.4 56.4 270.1 47.5 261.6 42.5
             L 241.2 29.8
             C 216.4 12.5 190.6 7.9 164.4 10
             C 149 11.2 133.3 15.3 118.5 22.2
             C 116.2 23.3 114.1 24.5 112 25.8 Z"
          fill="url(#rosettaLogoGrad)"/>
    <path d="M69.4 74 L 117.4 74
             C 140.7 74 159.4 84.7 169.4 102.5
             C 179.5 120.3 179.5 141.7 169.4 159.5
             L 118.6 250 L 49.2 250 L 89 179.8 L 69.4 179.8
             L 5.6 290 L -30.8 270
             L 42.2 144 L 0 144 L 0 116 L 56 116
             L 69.4 89 C 69.4 81 69.4 74 69.4 74 Z
             M 69.4 116 L 97.2 116 L 84.2 141 L 69.4 141 Z
             M 89 212 L 148.8 212
             C 155.3 202.6 159.7 192.6 162.6 182.6
             C 165.4 172.6 166.2 162.6 164.2 152.6
             C 162.6 144.6 158.2 136 151.8 129
             C 145.4 122 135.8 117.6 123.8 116 L 89 116 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- wordmark title -->
  <g transform="translate(320 86)">
    <text x="0" y="60"
          font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="72" font-weight="800" letter-spacing="-1.2" fill="#FFFFFF">
      Rosetta
    </text>
    <!-- underline -->
    <rect x="0" y="78" width="188" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="128"
          font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
          font-size="26" font-weight="500" letter-spacing="0" fill="#9AA8C2">
      FastAPI &nbsp;·&nbsp; Astro 7 &nbsp;·&nbsp; Svelte 5 &nbsp;·&nbsp; SQLAlchemy Async
    </text>
  </g>

  <!-- tech chips -->
  <g transform="translate(320 196)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <g>
      <rect x="0"   y="0" width="174" height="42" rx="10" fill="#00000033" stroke="#ffffff14" stroke-width="1"/>
      <rect x="12"  y="13" width="16" height="16" rx="4" fill="#1DA1FF"/>
      <text x="38" y="27" fill="#C8D4EB">uv run uvicorn</text>
    </g>
    <g transform="translate(194 0)">
      <rect x="0"   y="0" width="148" height="42" rx="10" fill="#00000033" stroke="#ffffff14" stroke-width="1"/>
      <rect x="12"  y="13" width="16" height="16" rx="4" fill="#7C3AED"/>
      <text x="38" y="27" fill="#C8D4EB">pnpm install</text>
    </g>
    <g transform="translate(356 0)">
      <rect x="0"   y="0" width="128" height="42" rx="10" fill="#00000033" stroke="#ffffff14" stroke-width="1"/>
      <rect x="12"  y="13" width="16" height="16" rx="4" fill="#FF5D01"/>
      <text x="38" y="27" fill="#C8D4EB">pnpm dev</text>
    </g>
  </g>
</svg>
