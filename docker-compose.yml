# ============================================================
# Rosetta 博客系统 - Docker Compose 生产环境配置
# ============================================================
# 一键启动:
#   docker compose up -d
#
# 默认访问地址:
#   前端:      http://localhost
#   后端 API:  http://localhost:8000
#   API 文档:  http://localhost:8000/docs (仅开发环境)
#   管理后台:  http://localhost/admin
#
# 默认管理员(首次启动通过 OOBE 向导创建,或使用以下默认):
#   用户名: admin
#   密码:   Admin123456
#   (请在 .env 中修改后再部署)
# ============================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: rosetta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rosetta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rosetta_secret}
      POSTGRES_DB: ${DB_NAME:-rosetta}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rosetta} -d ${DB_NAME:-rosetta}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rosetta-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: rosetta-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rosetta-network

  # 后端 API 服务(FastAPI)
  backend:
    build:
      context: .
      target: backend
      dockerfile: Dockerfile
    container_name: rosetta-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-rosetta}:${DB_PASSWORD:-rosetta_secret}@postgres:5432/${DB_NAME:-rosetta}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - REDIS_ENABLED=true
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-please}
      - SITE_URL=${SITE_URL:-http://localhost}
      - SITE_NAME=${SITE_NAME:-Rosetta Blog}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-让文字有处安放,让思想自由流淌}
      - SITE_KEYWORDS=${SITE_KEYWORDS:-blog,rosetta,fastapi,astro}
      - SITE_AUTHOR=${SITE_AUTHOR:-Administrator}
      - SITE_EMAIL=${SITE_EMAIL:-admin@example.com}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123456}
      - ADMIN_NICKNAME=${ADMIN_NICKNAME:-Administrator}
      - ENABLE_COMMENTS=${ENABLE_COMMENTS:-true}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-true}
      - ENABLE_RSS_FEED=${ENABLE_RSS:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKERS=${BACKEND_WORKERS:-4}
      - TZ=Asia/Shanghai
    volumes:
      - backend_media:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rosetta-network

  # 前端 Web 服务(Astro 静态站点 + nginx)
  frontend:
    build:
      context: .
      target: frontend
      dockerfile: Dockerfile
      args:
        ASTRO_API_BASE_URL: http://backend:8000
    container_name: rosetta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rosetta-network

volumes:
  postgres_data:
    driver: local
    name: rosetta-postgres-data
  redis_data:
    driver: local
    name: rosetta-redis-data
  backend_media:
    driver: local
    name: rosetta-backend-media

networks:
  rosetta-network:
    driver: bridge
    name: rosetta-network
