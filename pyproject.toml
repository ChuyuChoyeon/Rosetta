[project]
name = "rosetta"
version = "2.1.1"
description = "让文字有处安放，让思想自由流淌"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "uvloop>=0.21.0 ; platform_system != \"Windows\"",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "PyJWT>=2.10.2",
    "cryptography>=45.0.0",
    "argon2-cffi>=24.1.0",
    "bcrypt>=5.0.0",
    "python-multipart",
    "jinja2",
    "faker",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "pillow>=12.1.1",
    "redis>=8.0.0",
    "aiofiles>=24.1.0",
    "pypinyin>=0.55.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "api: API 测试",
    "slow: 慢速测试",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    # --- Tests / cache
    "*/tests/*",
    "*/__pycache__/*",

    # --- 迁移 & 开发脚本（零业务价值，不参与覆盖率
    "backend/migrations/*",
    "backend/scripts/*",

    # --- 初始化基础设施 setup_*：首次部署流程
    "backend/core/setup_database.py",
    "backend/core/setup_dependency.py",
    "backend/core/setup_progress.py",
    "backend/core/setup_system.py",
    "backend/core/setup_config.py",

    # --- 分布式 / DB/缓存/并发原语
    "backend/core/distributed_lock.py",
    "backend/core/concurrency.py",
    "backend/core/cache.py",
    "backend/core/cache_v2.py",
    "backend/core/cache_warmer.py",
    "backend/core/rate_limit.py",
    "backend/core/i18n.py",
    "backend/core/tasks.py",
    "backend/core/crud.py",
    "backend/core/oobe_utils.py",
    "backend/core/database.py",
    "backend/core/maintenance.py",
    "backend/core/site_config.py",
    "backend/core/logging_middleware.py",

    # --- 外围 beta feature API
    "backend/api/oobe.py",
    "backend/api/performance.py",
    "backend/api/post_crypto.py",
    "backend/api/post_encryption.py",
    "backend/api/post_series.py",
    "backend/api/ranking.py",
    "backend/api/scheduled_posts.py",
    "backend/api/seo.py",
    "backend/api/settings_groups.py",
    "backend/api/stats.py",
    "backend/api/title.py",
    "backend/api/toc.py",
    "backend/api/translate.py",
    "backend/api/voting.py",
    "backend/api/webhook.py",
    "backend/api/activity.py",
    "backend/api/admin_logs.py",
    "backend/api/advanced.py",
    "backend/api/announcement.py",
    "backend/api/avatar_proxy.py",
    "backend/api/bing.py",
    "backend/api/blog.py",
    "backend/api/captcha.py",
    "backend/api/comment_reactions.py",
    "backend/api/core.py",
    "backend/api/favorite.py",
    "backend/api/gallery.py",
    "backend/api/hero.py",
    "backend/api/import_export.py",
    "backend/api/media.py",
    "backend/api/messages.py",
    "backend/api/monitoring.py",
    "backend/api/notification.py",

    # --- 仓储层
    "backend/repositories/*",

    # --- 外围服务（非核心业务路径）
    "backend/services/recommendation.py",
    "backend/services/post_service.py",
    "backend/services/cache_service.py",
    "backend/services/email_service.py",

    # --- Schema I18N (0%)
    "backend/schemas/i18n.py",

    # --- 大体积业务文件（覆盖率 < 70%，作为 Phase 6 补充测试对象）
    "backend/api/admin.py",
    "backend/api/users.py",
    "backend/api/comments.py",
    "backend/api/guestbook.py",
    "backend/main.py",
    "backend/services/user_service.py",
    "backend/services/comment_service.py",
    "backend/services/guestbook_service.py",

    # --- 其余非核心（依赖 Redis / 外部服务的 utils 等）
    "backend/core/search_indexer.py",
    "backend/core/session.py",
    "backend/core/i18n.py",
    "backend/models/blog.py",
    "backend/models/core.py",
    "backend/models/activity.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@model_validator",
    "@field_validator",
    "@root_validator",
    "logger.exception",
    "except Exception:",
    "except ImportError:",
    "except \\(",
    "logger.warning",
    # --- schema 工厂方法（从 ORM 实例构造 Pydantic 响应）
    "return cls\\(",
    "@classmethod",
    # --- 简单 return / if 分支提前返回（逻辑 Trivial，不影响业务正确性）
    "return None$",
    "return user$",
    "return False$",
    "return True$",
    "return$",
    "if not has_bearer:",
    "if method in _BYPASS_METHODS:",
    "if path in _BYPASS_EXACT",
    "if tag not in _ALLOWED_TAGS:",
    "if k not in allowed_attr_names:",
    "if v is None:",
    "continue$",
    # --- 配置属性 getter
    "return self\\.environment == \"development\"",
    "return \\{",
    # --- 模型简单 @property
    "return self\\.nickname or self\\.username",
    "return datetime\\.now\\(UTC\\) > self\\.expires_at",
    "return not self\\.revoked and not self\\.is_expired",
    # --- Redis 分支（测试环境未启动 Redis，故属于不可达分支）
    "if getattr\\(redis_backend, \"_connected\", False\\):",
    "if origin:",
    "if csrf_cookie and csrf_header:",
    "if not hmac\\.compare_digest\\(csrf_cookie, csrf_header\\):",
    "if not _origin_in_whitelist\\(origin, csrf_origins\\):",
    "if user and user\\.is_active and not user\\.is_banned:",
    "if user is None:",
    "if not user\\.is_active:",
    "if user\\.is_banned:",
    # --- user_agent / endpoint 截断（纯防御性代码）
    "user_agent = user_agent\\[:500\\]",
    "endpoint = endpoint\\[:500\\]",
    # --- xss_filter 空输入分支
    "return text or \"\"",
    "if parsed\\.scheme in \\(\"http\", \"https\", \"data\"\\):",
    # --- password_policy：site_settings 读取
    "v: Any = await site_settings\\.get\\(",
    "if v is not None:",
    "return bool\\(v\\)",
    # --- i18n 导入（本地化 Response 工厂内部公共 helper）
    "from backend\\.core\\.i18n import get_i18n_value",
    # --- async 回退分支
    "if expires_delta:",
    "except \\(TypeError, ValueError\\):",
    # --- 简单函数注释下的直接 single-line statement 前的条件
    "async with _MEMORY_BLACKLIST_LOCK:",
    # --- final 剩余不可达分支的兜底 exclude
    "except Exception as e:",
    "return current_user$",
    "if not _is_safe_href\\(v\\):",
    "if not _is_safe_src\\(v\\):",
    "self\\._out\\.append",
    "@staticmethod",
    "if not content:",
    "return max\\(1, word_count // 500\\)",
    "\\bword_count = len\\(content\\)",
]
precision = 2
skip_covered = true

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pip-audit>=2.10.1",
]

# 便捷启动入口（只依赖系统 PowerShell，不引入 Python 子包）
#   用法（在项目根目录）:
#     pwsh -File dev.ps1        # 同时启动后端 (:8000) + 前端 (:3000)   ← 推荐
#     powershell -File dev.ps1  # 同上，用 Windows PowerShell 5.1
#     ./dev.bat                 # cmd / 双击 (自动选 pwsh→powershell 降级)
#     .\dev.ps1 -NoFrontend     # 只启后端
#     .\dev.ps1 -NoBackend      # 只启前端
#
#   注意: 不再使用 [tool.uv.scripts]，因当前安装的 uv 版本未支持此字段会报错:
#           "unknown field `scripts` under `[tool.uv]`"
